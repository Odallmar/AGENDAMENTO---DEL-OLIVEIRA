<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Del Oliveira - Spa da Pele - Agendamento</title>
  <style>
    :root {
      --primary: #d4708f;
      --primary-hover: #b85b77;
      --bg: #fff5f8;
      --card-bg: #ffffff;
      --text: #333333;
    }
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      background: var(--card-bg);
      max-width: 440px;
      width: 100%;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(212, 112, 143, 0.15);
    }
    h2 {
      text-align: center;
      color: var(--primary);
      margin-top: 0;
      font-size: 1.22rem;
      line-height: 1.35;
    }
    .field {
      margin-bottom: 14px;
    }
    label.field-title {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #555;
    }
    .required {
      color: #e74c3c;
      font-weight: bold;
    }
    input[type="text"], input[type="date"], input[type="time"], input[type="tel"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e0c8d1;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      background-color: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(212, 112, 143, 0.2);
    }
    input.input-error {
      border-color: #e74c3c !important;
      box-shadow: 0 0 0 2px rgba(231, 76, 60, 0.2) !important;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .row .field {
      flex: 1;
    }

    /* Campo de busca rápida de procedimentos */
    .search-box {
      margin-bottom: 6px;
      position: relative;
    }
    .search-box input {
      font-size: 0.85rem;
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid #e0c8d1;
      background-color: #fcf8fa;
    }

    /* Checklist de Serviços */
    .checklist-container {
      border: 1px solid #e0c8d1;
      border-radius: 10px;
      padding: 6px 10px;
      background: #faf4f6;
      max-height: 240px;
      overflow-y: auto;
    }
    .check-item {
      display: flex;
      align-items: center;
      padding: 7px 4px;
      border-bottom: 1px solid #f0e1e6;
      cursor: pointer;
      font-size: 0.88rem;
    }
    .check-item:last-child {
      border-bottom: none;
    }
    .check-item input[type="checkbox"] {
      margin-right: 10px;
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .check-item span.preco-badge {
      margin-left: auto;
      font-weight: 600;
      color: var(--primary);
      font-size: 0.82rem;
    }

    /* Totalizador */
    .total-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff0f5;
      border: 1px solid #f2c7d5;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary-hover);
    }

    /* Blocos Expansíveis */
    .collapsible-group {
      margin-top: 14px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-collapse {
      width: 100%;
      background: #fff;
      border: 1px solid #e0c8d1;
      color: #555;
      padding: 10px 14px;
      font-size: 0.86rem;
      font-weight: 600;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-collapse:hover {
      background: #faf2f5;
      border-color: var(--primary);
      color: var(--primary);
    }
    .collapse-content {
      display: none;
      background: #fdf7f9;
      border: 1px solid #f2dbe3;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
      color: #333;
      line-height: 1.45;
    }
    .collapse-content.open {
      display: block;
    }
    .maps-link {
      display: inline-block;
      margin-top: 6px;
      color: #1a73e8;
      text-decoration: none;
      font-weight: 600;
    }
    .maps-link:hover {
      text-decoration: underline;
    }

    /* Botão Toggle da Pré-visualização */
    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      margin-bottom: 6px;
    }
    .btn-toggle-small {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 4px 10px;
      font-size: 0.78rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-toggle-small:hover {
      background: var(--primary);
      color: #fff;
    }

    .preview-box {
      background: #fdf7f9;
      border: 1px dashed var(--primary);
      border-radius: 10px;
      padding: 14px;
      white-space: pre-wrap;
      font-size: 0.9rem;
      line-height: 1.4;
      color: #222;
      transition: all 0.3s ease;
    }
    .preview-box.hidden {
      display: none;
    }

    /* Ações */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    button.btn-main {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-cal { 
      background: #4285f4; 
      color: white; 
    }
    .btn-wpp { 
      background: #25d366; 
      color: white; 
    }
    .status-msg {
      text-align: center;
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 20px;
      font-weight: 600;
    }
    .success { color: #27ae60; }
    .error { color: #e74c3c; }
  </style>
</head>
<body>

<div class="container">
  <h2 id="header-titulo">💅 Del Oliveira - Spa da Pele - Agendamento</h2>

  <div class="field">
    <label class="field-title" for="cliente">Nome da Cliente: <span class="required">*</span></label>
    <input type="text" id="cliente" placeholder="Ex: Rebeca" oninput="validarNomeInput(); gerarCard();" />
  </div>

  <div class="field">
    <label class="field-title">Serviços / Procedimentos (Marque 1 ou mais):</label>
    <div class="search-box">
      <input type="text" id="filtroServicos" placeholder="🔍 Filtrar procedimentos..." oninput="filtrarProcedimentos()" />
    </div>
    <div id="checklist-servicos" class="checklist-container"></div>
  </div>

  <!-- Linha do Valor Total Previsto -->
  <div class="total-box">
    <span>Valor Total Previsto:</span>
    <span id="label-valor-total">R$ 0,00</span>
  </div>

  <!-- Data e Horário -->
  <div class="row">
    <div class="field">
      <label class="field-title" for="data">Data:</label>
      <input type="date" id="data" oninput="gerarCard()" />
    </div>
    <div class="field">
      <label class="field-title" for="hora">Horário de Início:</label>
      <input type="time" id="hora" value="08:00" oninput="gerarCard()" />
    </div>
  </div>

  <!-- WhatsApp -->
  <div class="field">
    <label class="field-title" for="telefone">WhatsApp (opcional, só DDD + número):</label>
    <input type="tel" id="telefone" placeholder="Ex: 68999999999" />
  </div>

  <!-- Blocos de Pagamento e Endereço (Abaixo do WhatsApp) -->
  <div class="collapsible-group">
    <button type="button" class="btn-collapse" onclick="toggleSecao('boxPagamento', 'setaPagamento')">
      <span>💳 Formas de Pagamento</span>
      <span id="setaPagamento">▼</span>
    </button>
    <div id="boxPagamento" class="collapse-content">
      <div id="info-pagamento-txt" style="margin-bottom: 6px;"></div>
      <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-weight:600; margin-top:8px;">
        <input type="checkbox" id="chkIncluirPagamento" checked onchange="gerarCard()" style="accent-color: var(--primary);" />
        <span>Incluir dados de pagamento no card</span>
      </label>
    </div>

    <button type="button" class="btn-collapse" onclick="toggleSecao('boxEndereco', 'setaEndereco')">
      <span>📍 Endereço e Localização (Google Maps)</span>
      <span id="setaEndereco">▼</span>
    </button>
    <div id="boxEndereco" class="collapse-content">
      <div id="info-endereco-txt"></div>
      <a id="link-maps" class="maps-link" href="#" target="_blank">🗺️ Ver no Google Maps</a>
      <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-weight:600; margin-top:8px;">
        <input type="checkbox" id="chkIncluirEndereco" checked onchange="gerarCard()" style="accent-color: var(--primary);" />
        <span>Incluir endereço e Maps no card</span>
      </label>
    </div>
  </div>

  <!-- Pré-visualização do Card (Inicia recolhida) -->
  <div class="preview-header">
    <label class="field-title" style="margin-bottom: 0;">Pré-visualização do Card:</label>
    <button type="button" id="btnTogglePreview" class="btn-toggle-small" onclick="togglePreview()">👁️ Mostrar Card</button>
  </div>
  <div id="preview" class="preview-box hidden"></div>

  <!-- Botões de Ação -->
  <div class="actions">
    <button id="btnAgenda" class="btn-main btn-cal" onclick="salvarNoGoogleCalendar()">📅 Salvar na Agenda</button>
    <button class="btn-main btn-wpp" onclick="enviarWhatsApp()">💬 WhatsApp</button>
  </div>
  
  <div id="status" class="status-msg"></div>
</div>

<!-- 1. Carrega o arquivo externo servicos.js -->
<script src="servicos.js"></script>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMD8kULt-Jf-UHqekqtfbTR8nbxIVvxPykvfmeO5ze1cVXjRgEpRFGrHT6VgQRx-Fa/exec";

  // Dicionário de emojis em escape Unicode seguro
  const EMOJI = {
    flor: "\u{1F338}",
    brilho: "\u{2728}",
    esmalte: "\u{1F485}",
    dinheiro: "\u{1F4B0}",
    calendario: "\u{1F4C5}",
    relogio: "\u{23F0}",
    coracao: "\u{1F496}",
    carinhaAmor: "\u{1F970}",
    coracaoRosa: "\u{1F495}",
    cartao: "\u{1F4B3}",
    borboleta: "\u{1F98B}",
    bolhas: "\u{1FAE7}",
    creme: "\u{1F9F4}",
    relax: "\u{1F486}\u{200D}\u{2640}\u{FE0F}",
    localizacao: "\u{1F4CD}",
    mapa: "\u{1F5FA}\u{FE0F}"
  };

  // Dados padrão de reserva (caso o arquivo servicos.js demore ou falhe)
  const DADOS_ESPACO_PADRAO = {
    nomeEspaco: "Del Oliveira - Spa da Pele",
    profissional: "Del Oliveira",
    formasPagamento: "PIX, Dinheiro, Cartão de Crédito e Débito",
    chavePix: "68999782433",
    endereco: "R. Isaura Parente, 1571 - Sl 3 - Estação Experimental, Rio Branco - AC, 69907-450",
    googleMapsUrl: "https://www.google.com/maps/search/?api=1&query=R.+Isaura+Parente,+1571+-+Sl+3+-+Esta%C3%A7%C3%A3o+Experimental,+Rio+Branco+-+AC,+69907-450"
  };

  function getEspacoConfig() {
    return (typeof CONFIG_ESPACO !== 'undefined') ? CONFIG_ESPACO : DADOS_ESPACO_PADRAO;
  }

  function getListaServicos() {
    return (typeof TABELA_SERVICOS !== 'undefined' && Array.isArray(TABELA_SERVICOS)) ? TABELA_SERVICOS : [];
  }

  function inicializarConfigEspaco() {
    const config = getEspacoConfig();
    document.getElementById('header-titulo').innerText = `${EMOJI.bolhas}${config.nomeEspaco} - Agendamento`;
    document.title = `${config.nomeEspaco} - Agendamento`;

    document.getElementById('info-pagamento-txt').innerHTML = `
      <strong>Aceitamos:</strong> ${config.formasPagamento}<br>
      <strong>Chave PIX:</strong> <code>${config.chavePix}</code>
    `;
    document.getElementById('info-endereco-txt').innerHTML = `
      <strong>Endereço:</strong> ${config.endereco}
    `;
    const linkMaps = document.getElementById('link-maps');
    if (config.googleMapsUrl) {
      linkMaps.href = config.googleMapsUrl;
    } else {
      linkMaps.style.display = 'none';
    }
  }

  // Preenche a data de hoje por padrão
  document.getElementById('data').value = new Date().toISOString().split('T')[0];

  function toggleSecao(idBox, idSeta) {
    const box = document.getElementById(idBox);
    const seta = document.getElementById(idSeta);
    const estaAberto = box.classList.contains('open');

    if (estaAberto) {
      box.classList.remove('open');
      seta.innerText = '▼';
    } else {
      box.classList.add('open');
      seta.innerText = '▲';
    }
  }

  function renderizarChecklist() {
    const container = document.getElementById('checklist-servicos');
    container.innerHTML = '';
    const lista = getListaServicos();

    if (lista.length === 0) {
      container.innerHTML = '<span style="color:#e74c3c; font-size:0.85rem;">Nenhum serviço carregado do arquivo servicos.js</span>';
      return;
    }

    lista.forEach(s => {
      const label = document.createElement('label');
      label.className = 'check-item';
      label.dataset.nomeFiltro = s.nome.toLowerCase();

      const duracaoTxt = s.duracao >= 60 
        ? `${Math.floor(s.duracao / 60)}h${s.duracao % 60 ? (s.duracao % 60) + 'm' : ''}` 
        : `${s.duracao}m`;

      const precoFmt = `R$ ${Number(s.preco).toFixed(2).replace('.', ',')}`;

      label.innerHTML = `
        <input type="checkbox" name="servicos" value="${s.id}" 
               data-nome="${s.nome}" data-preco="${s.preco}" data-duracao="${s.duracao}"
               ${s.padrao ? 'checked' : ''} onchange="gerarCard()" />
        <span>${s.nome} (${duracaoTxt})</span>
        <span class="preco-badge">${precoFmt}</span>
      `;
      container.appendChild(label);
    });
  }

  function filtrarProcedimentos() {
    const busca = document.getElementById('filtroServicos').value.toLowerCase().trim();
    const itens = document.querySelectorAll('#checklist-servicos .check-item');
    itens.forEach(item => {
      const nome = item.dataset.nomeFiltro || "";
      if (nome.includes(busca)) {
        item.style.display = 'flex';
      } else {
        item.style.display = 'none';
      }
    });
  }

  function togglePreview() {
    const box = document.getElementById('preview');
    const btn = document.getElementById('btnTogglePreview');
    if (box.classList.contains('hidden')) {
      box.classList.remove('hidden');
      btn.innerText = '👁️ Ocultar Card';
    } else {
      box.classList.add('hidden');
      btn.innerText = '👁️ Mostrar Card';
    }
  }

  function validarNomeInput() {
    const inputNome = document.getElementById('cliente');
    if (inputNome.value.trim() !== '') {
      inputNome.classList.remove('input-error');
    }
  }

  function getDadosSelecionados() {
    const checkboxes = document.querySelectorAll('input[name="servicos"]:checked');
    const servicos = [];
    let duracaoTotal = 0;
    let valorTotal = 0;

    checkboxes.forEach(cb => {
      const preco = parseFloat(cb.getAttribute('data-preco'));
      const duracao = parseInt(cb.getAttribute('data-duracao'), 10);
      const nome = cb.getAttribute('data-nome');

      servicos.push({
        id: cb.value,
        nome: nome,
        preco: preco,
        duracao: duracao
      });

      valorTotal += preco;
      duracaoTotal += duracao;
    });

    return { servicos, valorTotal, duracaoTotal };
  }

  function calcularHoraFim(horaInicioStr, minutos) {
    if (!horaInicioStr) return "";
    const [h, m] = horaInicioStr.split(':').map(Number);
    const date = new Date(2000, 0, 1, h, m + minutos);
    const fimH = String(date.getHours()).padStart(2, '0');
    const fimM = String(date.getMinutes()).padStart(2, '0');
    return `${fimH}:${fimM}`;
  }

  function montarMensagem() {
    const nomeInput = document.getElementById('cliente').value.trim();
    const nomeTratado = nomeInput ? nomeInput : "[Nome da Cliente]";
    const dataRaw = document.getElementById('data').value;
    const horaRaw = document.getElementById('hora').value;

    const { servicos, valorTotal, duracaoTotal } = getDadosSelecionados();

    document.getElementById('label-valor-total').innerText = `R$ ${valorTotal.toFixed(2).replace('.', ',')}`;

    let dataFmt = "A combinar";
    if (dataRaw) {
      const [ano, mes, dia] = dataRaw.split('-');
      dataFmt = `${dia}/${mes}`;
    }

    const horaInicioFmt = horaRaw ? `${horaRaw}h` : "08:00h";
    const horaFimFmt = horaRaw && duracaoTotal > 0 ? `${calcularHoraFim(horaRaw, duracaoTotal)}h` : "";
    const horarioExibicao = horaFimFmt ? `${horaInicioFmt} às ${horaFimFmt}` : horaInicioFmt;

    let listaServicosTxt = "";
    if (servicos.length === 0) {
      listaServicosTxt = "• A definir";
    } else {
      // Monta os itens sem recuo excessivo
      listaServicosTxt = servicos.map(s => `• ${s.nome} (R$ ${s.preco.toFixed(2).replace('.', ',')})`).join('\r\n');
    }

    const valorTotalFormatado = `R$ ${valorTotal.toFixed(2).replace('.', ',')}`;
    const config = getEspacoConfig();

    let blocoPagamento = "";
    const chkPag = document.getElementById('chkIncluirPagamento');
    if (chkPag && chkPag.checked) {
      blocoPagamento = `\r\n\r\n${EMOJI.cartao} *Pagamento: *${config.formasPagamento}\r\n🔑 *Chave PIX:* \`${config.chavePix}\``;
    }

    let blocoEndereco = "";
    const chkEnd = document.getElementById('chkIncluirEndereco');
    if (chkEnd && chkEnd.checked) {
      blocoEndereco = `\r\n\r\n${EMOJI.localizacao} *Endereço:* ${config.endereco}\r\n${EMOJI.mapa} *Google Maps:* ${config.googleMapsUrl}`;
    }

    // Exatamente 1 linha em branco entre 'Procedimento(s):' e o primeiro serviço
    return `*${EMOJI.borboleta} HORÁRIO AGENDADO ${EMOJI.borboleta}*

Oi, ${nomeTratado}! ${EMOJI.carinhaAmor}

Seu horário foi anotado e reservado com a *${config.nomeEspaco}*. ${EMOJI.brilho}

${EMOJI.bolhas} Procedimento(s):

${listaServicosTxt}

${EMOJI.dinheiro} Valor Total: ${valorTotalFormatado}

${EMOJI.calendario} Data:       *${dataFmt}*
${EMOJI.relogio} Horário: ${horarioExibicao}${blocoPagamento}${blocoEndereco}

${EMOJI.relax} Prepare-se para o seu momento de autocuidado! ${EMOJI.bolhas}

Vou ficar te esperando para cuidar de você com todo o carinho! ${EMOJI.brilho}

Prontinho! Seu horário está reservado para você. ${EMOJI.coracao}

Obrigada pela preferência e carinho! ${EMOJI.carinhaAmor}

*${config.profissional}* ${EMOJI.coracaoRosa}`;
  }

  function gerarCard() {
    document.getElementById('preview').innerText = montarMensagem();
  }

  function setStatus(msg, tipo = "success", duracao = 5000) {
    const el = document.getElementById('status');
    el.innerText = msg;
    el.className = `status-msg ${tipo}`;
    setTimeout(() => { el.innerText = ''; }, duracao);
  }

  function enviarWhatsApp() {
    const inputCliente = document.getElementById('cliente');
    const cliente = inputCliente.value.trim();

    if (!cliente) {
      inputCliente.classList.add('input-error');
      inputCliente.focus();
      setStatus("Por favor, preencha o nome da cliente antes de enviar.", "error");
      return;
    }

    const tel = document.getElementById('telefone').value.replace(/\D/g, '');
    const mensagemTexto = montarMensagem();
    const textoFormatado = encodeURIComponent(mensagemTexto);
    
    const baseUrl = tel 
      ? `https://api.whatsapp.com/send?phone=55${tel}&text=${textoFormatado}` 
      : `https://api.whatsapp.com/send?text=${textoFormatado}`;
    
    window.open(baseUrl, '_blank');
  }

  async function salvarNoGoogleCalendar() {
    const btn = document.getElementById('btnAgenda');
    const inputCliente = document.getElementById('cliente');
    const cliente = inputCliente.value.trim();
    const data = document.getElementById('data').value;
    const hora = document.getElementById('hora').value;
    const { servicos, valorTotal, duracaoTotal } = getDadosSelecionados();

    if (!cliente) {
      inputCliente.classList.add('input-error');
      inputCliente.focus();
      setStatus("Obrigatório preencher o nome da cliente!", "error");
      return;
    }

    if (servicos.length === 0) {
      setStatus("Por favor, selecione ao menos 1 serviço.", "error");
      return;
    }

    if (!data || !hora) {
      setStatus("Por favor, selecione data e horário.", "error");
      return;
    }

    btn.disabled = true;
    btn.innerText = "⏳ Verificando agenda...";

    try {
      const resposta = await fetch(SCRIPT_URL, {
        method: "POST",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          cliente: cliente,
          data: data,
          hora: hora,
          servicosDetalhados: servicos,
          duracaoTotal: duracaoTotal,
          valorTotal: valorTotal
        })
      });

      const res = await resposta.json();

      if (res.status === "conflict") {
        setStatus(`⚠️ ${res.message}`, "error", 7000);
      } else if (res.status === "success") {
        setStatus(`✓ Agendado: ${res.servicos} (${res.valorTotal}) - ${res.horarioPrevisto}`, "success", 6000);
      } else {
        setStatus(`Erro: ${res.message || "Falha no agendamento"}`, "error");
      }
    } catch (err) {
      console.error(err);
      setStatus("Erro ao comunicar com o Google Apps Script.", "error");
    } finally {
      btn.disabled = false;
      btn.innerText = "📅 Salvar na Agenda";
    }
  }

  // Inicialização segura
  inicializarConfigEspaco();
  renderizarChecklist();
  gerarCard();
</script>

</body>
</html>
